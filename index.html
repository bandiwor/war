<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>War</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #c8d0d8;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        font:
          12px/1.35 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        letter-spacing: 0.3em;
        color: #8a949e;
      }
      .debug-menu {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 360px;
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 8px 10px;
        background: rgba(8, 10, 12, 0.88);
        border: 1px solid #2a3036;
      }
      .debug-menu pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
      }
      .debug-menu button,
      .debug-menu select {
        margin: 0 6px 6px 0;
        font: inherit;
      }
      .debug-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .debug-tab.active {
        background: #3a4a58;
        color: #fff;
      }
      .debug-slider {
        display: grid;
        grid-template-columns: 90px 1fr 52px;
        gap: 6px;
        align-items: center;
      }
      .debug-effect summary {
        cursor: pointer;
        padding: 2px 0;
      }
      .bench-report {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #3a4a58;
        color: #e6e9ec;
      }
      .debug-meter {
        display: block;
        height: 6px;
        background: #6fd3b5;
        width: 0;
      }
      .debug-menu fieldset {
        border: 1px solid #2a3036;
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/presentation/main.ts"></script>
  </body>
</html>
