<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>War</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #c8d0d8;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        font:
          12px/1.35 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        letter-spacing: 0.3em;
        color: #8a949e;
      }
      .debug-menu {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 360px;
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 8px 10px;
        background: rgba(8, 10, 12, 0.88);
        border: 1px solid #2a3036;
      }
      .debug-menu pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
      }
      .debug-menu button,
      .debug-menu select {
        margin: 0 6px 6px 0;
        font: inherit;
      }
      .debug-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .debug-tab.active {
        background: #3a4a58;
        color: #fff;
      }
      .debug-slider {
        display: grid;
        grid-template-columns: 90px 1fr 52px;
        gap: 6px;
        align-items: center;
      }
      .debug-effect summary {
        cursor: pointer;
        padding: 2px 0;
      }
      .bench-report {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #3a4a58;
        color: #e6e9ec;
      }
      .debug-meter {
        display: block;
        height: 6px;
        background: #6fd3b5;
        width: 0;
      }
      .debug-menu fieldset {
        border: 1px solid #2a3036;
        margin: 0 0 8px;
      }
      .bestiary-list button.active {
        background: #3a4a58;
        color: #fff;
      }
      .bestiary-stage {
        display: block;
        width: 320px;
        height: 240px;
        margin: 6px 0;
        border: 1px solid #2a3036;
        cursor: grab;
        touch-action: none;
      }
      /* Phone controls: stick on the left half, look pad on the right, buttons bottom-right. */
      .touch-controls {
        position: absolute;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        --pad: max(12px, env(safe-area-inset-right));
      }
      .tc-stick-zone,
      .tc-look-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        touch-action: none;
      }
      .tc-stick-zone {
        left: 0;
        width: 45%;
      }
      .tc-look-zone {
        right: 0;
        width: 55%;
      }
      .tc-stick-base {
        position: absolute;
        left: max(90px, calc(env(safe-area-inset-left) + 90px));
        top: calc(100% - 100px);
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        border: 2px solid rgba(200, 208, 216, 0.25);
        background: rgba(200, 208, 216, 0.06);
        pointer-events: none;
      }
      .tc-stick-base.active {
        border-color: rgba(200, 208, 216, 0.5);
      }
      .tc-stick-knob {
        position: absolute;
        left: 32px;
        top: 32px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(200, 208, 216, 0.35);
      }
      .tc-btn {
        position: absolute;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(200, 208, 216, 0.35);
        background: rgba(8, 10, 12, 0.35);
        color: rgba(230, 233, 236, 0.85);
        font-size: 10px;
        letter-spacing: 0.08em;
        touch-action: none;
      }
      .tc-btn.on {
        background: rgba(200, 208, 216, 0.35);
        color: #000;
      }
      .tc-fire {
        right: calc(var(--pad) + 64px);
        bottom: 28px;
        width: 84px;
        height: 84px;
        font-size: 13px;
        border-color: rgba(220, 120, 110, 0.6);
      }
      .tc-aim {
        right: calc(var(--pad) + 160px);
        bottom: 24px;
      }
      .tc-jump {
        right: var(--pad);
        bottom: 24px;
      }
      .tc-crouch {
        right: var(--pad);
        bottom: 88px;
      }
      .tc-reload {
        right: calc(var(--pad) + 80px);
        bottom: 124px;
      }
      .tc-sprint {
        left: max(12px, env(safe-area-inset-left));
        bottom: 190px;
      }
      .tc-weapon {
        right: var(--pad);
        top: 64px;
      }
      .tc-mode {
        right: calc(var(--pad) + 62px);
        top: 64px;
      }
      .tc-light {
        right: calc(var(--pad) + 124px);
        top: 64px;
      }
      .tc-use {
        right: calc(var(--pad) + 144px);
        bottom: 96px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/presentation/main.ts"></script>
  </body>
</html>
