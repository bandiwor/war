<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>War</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #c8d0d8;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        font:
          12px/1.35 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        letter-spacing: 0.3em;
        color: #8a949e;
      }
      /* Level editor (stage 9). */
      #app.editor {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr) 320px;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          'top top top'
          'left view right'
          'status status status';
      }
      .ed-top {
        grid-area: top;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px;
        background: #0c0f12;
        border-bottom: 1px solid #2a3036;
      }
      .ed-left,
      .ed-right {
        overflow: auto;
        padding: 6px;
        background: #0c0f12;
      }
      .ed-left {
        grid-area: left;
        display: grid;
        align-content: start;
        gap: 4px;
      }
      .ed-right {
        grid-area: right;
      }
      .ed-canvas {
        grid-area: view;
        width: 100%;
        height: 100%;
        display: block;
        min-height: 0;
        cursor: crosshair;
      }
      .ed-status {
        grid-area: status;
        padding: 3px 8px;
        background: #0c0f12;
        color: #8a949e;
      }
      #app.editor button,
      #app.editor select,
      #app.editor input,
      #app.editor textarea {
        font: inherit;
        background: #161b20;
        color: #c8d0d8;
        border: 1px solid #2a3036;
      }
      #app.editor button.active {
        background: #3a4a58;
        color: #fff;
      }
      #app.editor textarea {
        width: 100%;
        box-sizing: border-box;
      }
      #app.editor select[size] {
        width: 100%;
      }
      .ed-hint {
        color: #6c7680;
        margin: 4px 0;
      }
      .ed-issue {
        cursor: pointer;
        padding: 2px 0;
      }
      .ed-issue.error {
        color: #ff7a6a;
      }
      .ed-issue.warning {
        color: #ffd36a;
      }
      .ed-ok {
        color: #59c48a;
      }
      .ed-sel {
        color: #ffb347;
        margin-bottom: 4px;
      }
      @media (max-width: 760px) {
        #app.editor {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto 50vh auto auto;
          grid-template-areas: 'top' 'left' 'view' 'right' 'status';
        }
      }
      /* Story HUD (stage 8): subtitles, prompt, toasts, chapter card, journal, ending. */
      .story-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        letter-spacing: 0.04em;
      }
      /* Classes that set display must not override the hidden attribute. */
      .story-hud [hidden] {
        display: none !important;
      }
      .story-subtitle {
        position: absolute;
        left: 50%;
        bottom: 9%;
        transform: translateX(-50%);
        max-width: min(720px, calc(100% - 32px));
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.62);
        color: #e8ecef;
        text-align: center;
        font-size: 14px;
      }
      .story-channel {
        color: #ffb347;
        font-size: 11px;
        letter-spacing: 0.18em;
        margin-bottom: 2px;
      }
      .story-prompt {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        padding: 3px 10px;
        border: 1px solid rgba(255, 179, 71, 0.6);
        background: rgba(0, 0, 0, 0.45);
        color: #ffcf8a;
      }
      .story-toasts {
        position: absolute;
        left: 16px;
        top: 64px;
        display: grid;
        gap: 4px;
      }
      .story-toast {
        padding: 2px 8px;
        background: rgba(0, 0, 0, 0.5);
        color: #cfe3d6;
        border-left: 2px solid #59c48a;
      }
      .story-chapter {
        position: absolute;
        left: 0;
        right: 0;
        top: 24%;
        text-align: center;
        color: #d5dbe0;
        text-shadow: 0 0 8px #000;
      }
      .story-chapter-title {
        font-size: 26px;
        letter-spacing: 0.4em;
        margin-bottom: 8px;
      }
      .story-journal {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(620px, calc(100% - 32px));
        max-height: 76%;
        overflow: auto;
        padding: 14px 18px;
        background: rgba(6, 8, 10, 0.92);
        border: 1px solid #3a4248;
        pointer-events: auto;
      }
      .story-journal-title {
        color: #ffb347;
        letter-spacing: 0.2em;
        margin: 6px 0;
      }
      .story-journal-summary,
      .story-quest-summary {
        color: #8a949e;
        margin-bottom: 6px;
      }
      .story-quest {
        margin: 8px 0;
      }
      .story-quest.done,
      .story-objective.done {
        color: #6c7680;
      }
      .story-objective {
        margin-left: 14px;
      }
      .story-log {
        margin: 8px 0;
        padding-left: 8px;
        border-left: 1px solid #3a4248;
      }
      .story-log-title {
        color: #c8d0d8;
      }
      .story-log-line {
        color: #9aa4ad;
      }
      .story-journal-hint {
        color: #5c666e;
        margin-top: 10px;
      }
      .story-ending {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 10px;
        padding: 16px;
        background: rgba(0, 0, 0, 0.94);
        color: #d5dbe0;
        text-align: center;
        pointer-events: auto;
      }
      .story-ending-title {
        font-size: 24px;
        letter-spacing: 0.35em;
        color: #ffb347;
        margin-bottom: 12px;
      }
      .story-ending-line {
        max-width: 640px;
      }
      .story-ending-buttons button {
        margin: 16px 8px 0;
        font: inherit;
      }
      .debug-menu {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 360px;
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 8px 10px;
        background: rgba(8, 10, 12, 0.88);
        border: 1px solid #2a3036;
      }
      .debug-menu pre {
        margin: 0 0 6px;
        white-space: pre-wrap;
      }
      .debug-menu button,
      .debug-menu select {
        margin: 0 6px 6px 0;
        font: inherit;
      }
      .debug-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .debug-tab.active {
        background: #3a4a58;
        color: #fff;
      }
      .debug-slider {
        display: grid;
        grid-template-columns: 90px 1fr 52px;
        gap: 6px;
        align-items: center;
      }
      .debug-effect summary {
        cursor: pointer;
        padding: 2px 0;
      }
      .bench-report {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #3a4a58;
        color: #e6e9ec;
      }
      .debug-meter {
        display: block;
        height: 6px;
        background: #6fd3b5;
        width: 0;
      }
      .debug-menu fieldset {
        border: 1px solid #2a3036;
        margin: 0 0 8px;
      }
      .bestiary-list button.active {
        background: #3a4a58;
        color: #fff;
      }
      .bestiary-stage {
        display: block;
        width: 320px;
        height: 240px;
        margin: 6px 0;
        border: 1px solid #2a3036;
        cursor: grab;
        touch-action: none;
      }
      /* Phone controls: stick on the left half, look pad on the right, buttons bottom-right. */
      .touch-controls {
        position: absolute;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        --pad: max(12px, env(safe-area-inset-right));
      }
      .tc-stick-zone,
      .tc-look-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        touch-action: none;
      }
      .tc-stick-zone {
        left: 0;
        width: 45%;
      }
      .tc-look-zone {
        right: 0;
        width: 55%;
      }
      .tc-stick-base {
        position: absolute;
        left: max(90px, calc(env(safe-area-inset-left) + 90px));
        top: calc(100% - 100px);
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        border: 2px solid rgba(200, 208, 216, 0.25);
        background: rgba(200, 208, 216, 0.06);
        pointer-events: none;
      }
      .tc-stick-base.active {
        border-color: rgba(200, 208, 216, 0.5);
      }
      .tc-stick-knob {
        position: absolute;
        left: 32px;
        top: 32px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(200, 208, 216, 0.35);
      }
      .tc-btn {
        position: absolute;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(200, 208, 216, 0.35);
        background: rgba(8, 10, 12, 0.35);
        color: rgba(230, 233, 236, 0.85);
        font-size: 10px;
        letter-spacing: 0.08em;
        touch-action: none;
      }
      .tc-btn.on {
        background: rgba(200, 208, 216, 0.35);
        color: #000;
      }
      .tc-fire {
        right: calc(var(--pad) + 64px);
        bottom: 28px;
        width: 84px;
        height: 84px;
        font-size: 13px;
        border-color: rgba(220, 120, 110, 0.6);
      }
      .tc-aim {
        right: calc(var(--pad) + 160px);
        bottom: 24px;
      }
      .tc-jump {
        right: var(--pad);
        bottom: 24px;
      }
      .tc-crouch {
        right: var(--pad);
        bottom: 88px;
      }
      .tc-reload {
        right: calc(var(--pad) + 80px);
        bottom: 124px;
      }
      .tc-sprint {
        left: max(12px, env(safe-area-inset-left));
        bottom: 190px;
      }
      .tc-weapon {
        right: var(--pad);
        top: 64px;
      }
      .tc-mode {
        right: calc(var(--pad) + 62px);
        top: 64px;
      }
      .tc-light {
        right: calc(var(--pad) + 124px);
        top: 64px;
      }
      .tc-use {
        right: calc(var(--pad) + 144px);
        bottom: 96px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/presentation/main.ts"></script>
  </body>
</html>
